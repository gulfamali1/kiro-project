<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Picker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Color Palette</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Menu 1</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Menu 2</a>
                    </li>
                </ul>
                <button class="btn btn-outline-primary">Explore</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section: Random Color Boxes -->
    <div class="container-fluid p-0">
        <div class="row g-0" id="heroColorBoxes">
            <div class="col">
                <div class="color-box" data-box="0">
                    <span class="hex-code"></span>
                </div>
            </div>
            <div class="col">
                <div class="color-box" data-box="1">
                    <span class="hex-code"></span>
                </div>
            </div>
            <div class="col">
                <div class="color-box" data-box="2">
                    <span class="hex-code"></span>
                </div>
            </div>
            <div class="col">
                <div class="color-box" data-box="3">
                    <span class="hex-code"></span>
                </div>
            </div>
            <div class="col">
                <div class="color-box" data-box="4">
                    <span class="hex-code"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Generator Section -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Generate Tints & Shades</h2>
                
                <!-- Color Picker Input -->
                <div class="mb-3">
                    <label for="colorPicker" class="form-label">Select Base Color</label>
                    <input type="color" id="colorPicker" class="form-control form-control-color" value="#3498db" title="Choose your base color">
                </div>
                
                <!-- Generate Button -->
                <div class="d-grid">
                    <button id="generateBtn" class="btn btn-primary btn-lg">Generate Tints & Shades</button>
                </div>
            </div>
        </div>
        
        <!-- Tints Display -->
        <div class="mt-5">
            <h3 class="mb-3">Tints</h3>
            <div id="tintsDisplay" class="row g-3">
                <!-- Dynamically generated tint cards -->
            </div>
        </div>
        
        <!-- Shades Display -->
        <div class="mt-5">
            <h3 class="mb-3">Shades</h3>
            <div id="shadesDisplay" class="row g-3">
                <!-- Dynamically generated shade cards -->
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
